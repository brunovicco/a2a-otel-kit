receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
exporters:
  otlphttp/tempo:
    endpoint: http://tempo:4318
    tls:
      insecure: true
  file/demo:
    path: /receipts/traces.jsonl
    format: json
service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [otlphttp/tempo, file/demo]
